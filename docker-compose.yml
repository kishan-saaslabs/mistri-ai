services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mistri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mistri}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mistri_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mistri} -d ${POSTGRES_DB:-mistri}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mistri_pgdata:
